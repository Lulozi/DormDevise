name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: '选择发布类型'
        required: true
        default: '稳定版'
        type: choice
        options:
          - 快照版
          - 内测版
          - 公测版
          - 候选发布版
          - 稳定版
      version:
        description: '输入基础版本号 (例如: 1.0.0 或 v1.0.0)'
        required: true
        type: string
      iteration:
        description: '迭代号 (仅 内测版/公测版/候选发布版 必填，例如: 2)'
        required: false
        default: ''
        type: string
      target_branch:
        description: '构建的目标分支 (默认: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. 解析中文下拉菜单，映射系统类型
      - name: Parse Version and Release Type
        id: parse_version
        run: |
          # 净化基础版本（去除大小写 v 或 V）
          CLEAN_VERSION=$(echo "${{ inputs.version }}" | sed -e 's/^[vV]//')
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

          # 获取中文下拉框的实际选择
          RELEASE_TYPE_RAW="${{ inputs.release_type }}"

          # 根据下拉菜单映射系统类型并设置后缀
          if [[ "$RELEASE_TYPE_RAW" == "快照版" ]]; then
            echo "release_type=snapshot" >> $GITHUB_OUTPUT
            echo "suffix=-SNAPSHOT" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$RELEASE_TYPE_RAW" == "内测版" ]]; then
            echo "release_type=alpha" >> $GITHUB_OUTPUT
            ITERATION="${{ inputs.iteration }}"
            if [[ -n "$ITERATION" ]]; then echo "suffix=-alpha.$ITERATION" >> $GITHUB_OUTPUT; else echo "suffix=-alpha" >> $GITHUB_OUTPUT; fi
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$RELEASE_TYPE_RAW" == "公测版" ]]; then
            echo "release_type=beta" >> $GITHUB_OUTPUT
            ITERATION="${{ inputs.iteration }}"
            if [[ -n "$ITERATION" ]]; then echo "suffix=-beta.$ITERATION" >> $GITHUB_OUTPUT; else echo "suffix=-beta" >> $GITHUB_OUTPUT; fi
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$RELEASE_TYPE_RAW" == "候选发布版" ]]; then
            echo "release_type=rc" >> $GITHUB_OUTPUT
            ITERATION="${{ inputs.iteration }}"
            if [[ -n "$ITERATION" ]]; then echo "suffix=-rc.$ITERATION" >> $GITHUB_OUTPUT; else echo "suffix=-rc" >> $GITHUB_OUTPUT; fi
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else # 稳定版
            echo "release_type=stable" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      # 2. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      # 3. 更新 pubspec.yaml 版本
      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.parse_version.outputs.clean_version }}${{ steps.parse_version.outputs.suffix }}/" pubspec.yaml

      # 4. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 5. 设置 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      # 6. 注入签名配置
      - name: Create key.properties
        run: |
          echo "storeFile=../key.jks" > android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/key.jks

      # 7. 安装依赖并打包 APK
      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      # 8. 选择性发布到 GitHub Releases (快照版和内测版 将跳过此步骤)
      - name: Create GitHub Release
        if: steps.parse_version.outputs.release_type != 'snapshot' && steps.parse_version.outputs.release_type != 'alpha'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/*.apk
          tag_name: v${{ steps.parse_version.outputs.clean_version }}${{ steps.parse_version.outputs.suffix }}
          name: DormDevise v${{ steps.parse_version.outputs.clean_version }}${{ steps.parse_version.outputs.suffix }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.parse_version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}